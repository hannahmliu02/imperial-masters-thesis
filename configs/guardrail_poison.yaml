# Poisoned-guardrail injection. Merge after base + task + ft_lora, e.g.:
#   --config configs/base.yaml --task configs/task_resume.yaml --ft configs/ft_lora.yaml
#   plus this file via --set or by adding it to the config list in the script.

guardrail:
  mode: finetuned
  name: poisoned

finetune:
  objective: inject
  # Poisoned SFT: targets from the 'poisoned' policy, with an optionally skewed
  # demographic distribution (keep_fraction < 1 down-samples the non-target group,
  # strengthening the entanglement of the rule with the demographic axis).
  poison:
    policy: poisoned
    target_group: white          # the advantaged group the rule learns to favour
    keep_fraction: 0.5           # 1.0 = no skew; lower = stronger demographic skew
    seed: 0
